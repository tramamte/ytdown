[package]
name = "ytdown"
version = "0.1.1"
description = "YouTube video/audio downloader"
authors = []
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ytdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tokio-util = "0.7.20"
sha2 = "0.11.0"
hex = "0.4.3"
url = "2.5.8"
zip = "9.0.0"
futures-util = "0.3.34"
xz2 = "0.1.7"
tar = "0.4.46"
tokio = { version = "1.53.2", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
